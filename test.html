<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Player</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .relative {
            position: relative;
            background: #E5E5E5;
            border-radius: 1.5rem;
            overflow: hidden;
            aspect-ratio: 16/9;
            width: 100%;
            max-width: 35rem;
            height: 31rem;
        }
        
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .play-button {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: rgba(0,0,0,0.2);
            cursor: pointer;
        }
        
        .play-icon {
            font-size: 4rem;
            color: white;
        }
    </style>
</head>
<body>
    <div class="relative" id="videoContainer">
        <video id="myVideo" preload="metadata" poster="./assets/images/video-thumb.jpg">
            <source src="./assets/video/demo.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>
        <div class="play-button" id="playButton">
            <i class="fa-solid fa-play play-icon"></i>
        </div>
    </div>

    <script>
        // Wait for the DOM to be fully loaded
        document.addEventListener('DOMContentLoaded', function() {
            // Get references to our elements
            const videoContainer = document.getElementById('videoContainer');
            const video = document.getElementById('myVideo');
            const playButton = document.getElementById('playButton');
            
            // Add muted attribute to help with autoplay policies
            video.muted = true;
            
            // Function to play video
            function playVideo() {
                // Using a promise to handle autoplay restrictions
                const playPromise = video.play();
                
                if (playPromise !== undefined) {
                    playPromise
                        .then(() => {
                            playButton.style.display = 'none';
                            console.log('Video playing');
                        })
                        .catch(error => {
                            // Auto-play was prevented
                            console.log('Autoplay prevented:', error);
                            // Show a user interaction message if needed
                        });
                }
            }
            
            // Function to pause video
            function pauseVideo() {
                video.pause();
                playButton.style.display = 'flex';
                console.log('Video paused');
            }
            
            // Play on hover
            videoContainer.addEventListener('mouseenter', function() {
                console.log('Mouse entered');
                playVideo();
            });
            
            // Pause when mouse leaves
            videoContainer.addEventListener('mouseleave', function() {
                console.log('Mouse left');
                pauseVideo();
            });
            
            // Play/pause on click
            playButton.addEventListener('click', function(e) {
                console.log('Play button clicked');
                e.stopPropagation();
                playVideo();
            });
            
            // Toggle play/pause when clicking on video
            videoContainer.addEventListener('click', function() {
                console.log('Container clicked');
                if (video.paused) {
                    playVideo();
                } else {
                    pauseVideo();
                }
            });
            
            // Show play button when video ends
            video.addEventListener('ended', function() {
                console.log('Video ended');
                playButton.style.display = 'flex';
            });
            
            // Debug to check if script is loading
            console.log('Video player script loaded');
        });
    </script>
</body>
</html>
