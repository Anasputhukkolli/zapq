<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Z Logo Loading Animation</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background-color: #f5f5f5;
      font-family: Arial, sans-serif;
    }
    
    .container {
      text-align: center;
    }
    
    .loader-container {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(255, 255, 255, 0.8);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }
    
    .loader {
      width: 80px;
      height: 80px;
      animation: spin 1.5s linear infinite;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    .content {
      max-width: 600px;
      margin: 0 auto;
    }
    
    button {
      padding: 10px 20px;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 16px;
      margin: 10px;
    }
    
    button:hover {
      background-color: #45a049;
    }
  </style>
</head>
<body>
  <div class="loader-container" id="loaderContainer">
    <img src="./assets/images/logo.png" class="loader" alt="Loading...">
  </div>
  
  <div class="container">
    <div class="content">
      <h1>Z Logo Loading Demo</h1>
      <p>Click the buttons below to navigate. The loading animation will appear before redirecting.</p>
      
      <button onclick="navigateWithLoading('./index.html')">Navigate to Home Page</button>
      <button onclick="navigateWithLoading('./page2.html')">Navigate to Page 2</button>
      <button onclick="navigateWithLoading('./page3.html')">Navigate to Page 3</button>
      
      <div id="currentPage">
        <h2>Demo Page</h2>
        <p>This is the demo page. Click any button above to navigate to a different page with the loading animation.</p>
      </div>
    </div>
  </div>

  <script>
    function navigateWithLoading(url) {
      // Show loader
      const loader = document.getElementById('loaderContainer');
      loader.style.display = 'flex';
      
      // Simulate a short delay before actual navigation
      setTimeout(function() {
        // Actual navigation
        window.location.href = url;
      }, 1500); // 1.5 seconds delay to show the loading animation
    }
  </script>
</body>
</html>
