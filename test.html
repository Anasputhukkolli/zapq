<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Logo Design</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .slider-container {
            overflow: hidden;
            position: relative;
        }

        .slider-wrapper {
            display: flex;
            transition: transform 0.3s ease;
        }

        .slider-card {
            min-width: 100%;
            flex: 0 0 100%;
        }

        .slider-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.9);
            border: none;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: #333;
            cursor: pointer;
            transition: all 0.3s ease;
            z-index: 10;
        }

        .slider-nav:hover {
            background: white;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .slider-prev {
            left: 10px;
        }

        .slider-next {
            right: 10px;
        }

        .slider-dots {
            text-align: center;
            margin-top: 20px;
        }

        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.5);
            display: inline-block;
            margin: 0 5px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .dot.active {
            background: white;
            transform: scale(1.2);
        }

        @media (min-width: 768px) {
            .slider-card {
                min-width: 50%;
                flex: 0 0 50%;
            }
        }

        @media (min-width: 992px) {
            .slider-card {
                min-width: 33.333%;
                flex: 0 0 33.333%;
            }
        }

        @media (min-width: 1200px) {
            .slider-card {
                min-width: 25%;
                flex: 0 0 25%;
            }
        }

        .logo-container {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 50px 0;
        }

        .logo-card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            padding: 20px;
            margin-bottom: 30px;
            transition: transform 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-card:hover {
            transform: translateY(-5px);
        }

        .logo-example {
            width: 120px;
            height: 120px;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: white;
            padding: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .logo-example img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 8px;
        }

        .header-title {
            color: white;
            font-size: 3rem;
            font-weight: 700;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
            margin-bottom: 20px;
        }

        .header-subtitle {
            color: rgba(255, 255, 255, 0.9);
            font-size: 1.2rem;
            margin-bottom: 50px;
        }
    </style>
</head>

<body>
    <div class="logo-container">
        <div class="wrapper">
            <div class="container">
                <div class="text-center text-[1rem] md:text-[1.3rem] font-[poppinsmedium] text-[#5D6561] relative top-[4.9rem] md:top-[7.1rem] lg:top-[2.6rem]">
                    Trusted by leaders in the industry
                </div>

                <div class="slider-container">
                    <div class="slider-wrapper" id="logoSlider">
                        <div class="slider-card">
                            <div class="logo-card text-center mx-3">
                                <div class="logo-example">
                                    <img src="./assets/images/Ayur_Salama.png" alt="Ayur Salama">
                                </div>
                            </div>
                        </div>

                        <div class="slider-card">
                            <div class="logo-card text-center mx-3">
                                <div class="logo-example">
                                    <img src="./assets/images/Dr JK_s Fertility Clinic.png" alt="Dr JK's Fertility Clinic">
                                </div>
                            </div>
                        </div>

                        <div class="slider-card">
                            <div class="logo-card text-center mx-3">
                                <div class="logo-example">
                                    <img src="./assets/images/Medicore_Homeopathic_Clinic.png" alt="Medicore Homeopathic Clinic">
                                </div>
                            </div>
                        </div>

                        <div class="slider-card">
                            <div class="logo-card text-center mx-3">
                                <div class="logo-example">
                                    <img src="./assets/images/Z9_Homoeopathic_Clinic.png" alt="Z9 Homoeopathic Clinic">
                                </div>
                            </div>
                        </div>

                        <div class="slider-card">
                            <div class="logo-card text-center mx-3">
                                <div class="logo-example">
                                    <img src="./assets/images/Noor_Eye_Clinic___Opticals.png" alt="Noor Eye Clinic & Opticals">
                                </div>
                            </div>
                        </div>

                        <div class="slider-card">
                            <div class="logo-card text-center mx-3">
                                <div class="logo-example">
                                    <img src="./assets/images/Neo Skin Speciality Centre.webp" alt="Neo Skin Speciality Centre">
                                </div>
                            </div>
                        </div>

                        <div class="slider-card">
                            <div class="logo-card text-center mx-3">
                                <div class="logo-example">
                                    <img src="./assets/images/Medicore_Homeopathic_Clinic.png" alt="Medicore Homeopathic Clinic">
                                </div>
                            </div>
                        </div>
                    </div>

                    <button class="slider-nav slider-prev" onclick="prevSlide()">‹</button>
                    <button class="slider-nav slider-next" onclick="nextSlide()">›</button>

                    <div class="slider-dots">
                        <span class="dot active" onclick="currentSlide(1)"></span>
                        <span class="dot" onclick="currentSlide(2)"></span>
                        <span class="dot" onclick="currentSlide(3)"></span>
                        <span class="dot" onclick="currentSlide(4)"></span>
                        <span class="dot" onclick="currentSlide(5)"></span>
                        <span class="dot" onclick="currentSlide(6)"></span>
                        <span class="dot" onclick="currentSlide(7)"></span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
    <script>
        let currentSlideIndex = 0;
        const slider = document.getElementById('logoSlider');
        const totalSlides = 7;
        let slidesToShow = getSlidesToShow();

        function getSlidesToShow() {
            if (window.innerWidth >= 1200) return 4;
            if (window.innerWidth >= 992) return 3;
            if (window.innerWidth >= 768) return 2;
            return 1;
        }

        function updateSlider() {
            const slideWidth = 100 / slidesToShow;
            const maxSlide = totalSlides - slidesToShow;

            if (currentSlideIndex > maxSlide) {
                currentSlideIndex = maxSlide;
            }

            slider.style.transform = `translateX(-${currentSlideIndex * slideWidth}%)`;

            // Update dots
            const dots = document.querySelectorAll('.dot');
            dots.forEach((dot, index) => {
                dot.classList.toggle('active', index === currentSlideIndex);
            });
        }

        function nextSlide() {
            const maxSlide = totalSlides - slidesToShow;
            if (currentSlideIndex < maxSlide) {
                currentSlideIndex++;
                updateSlider();
            }
        }

        function prevSlide() {
            if (currentSlideIndex > 0) {
                currentSlideIndex--;
                updateSlider();
            }
        }

        function currentSlide(index) {
            const maxSlide = totalSlides - slidesToShow;
            currentSlideIndex = Math.min(index - 1, maxSlide);
            updateSlider();
        }

        // Handle window resize
        window.addEventListener('resize', () => {
            slidesToShow = getSlidesToShow();
            updateSlider();
        });

        // Auto-slide every 3 seconds
        setInterval(() => {
            const maxSlide = totalSlides - slidesToShow;
            if (currentSlideIndex >= maxSlide) {
                currentSlideIndex = 0;
            } else {
                currentSlideIndex++;
            }
            updateSlider();
        }, 3000);

        // Initialize slider
        updateSlider();
    </script>
</body>

</html>
